<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Editar categoria')}"></head>
<body>
<header th:replace="~{fragments :: cabecalho}"></header>
<main class="conteudo estreito">
    <div th:replace="~{fragments :: alertas}"></div>

    <a class="voltar" th:href="@{/web/categorias}">← Categorias</a>
    <h1>Editar categoria</h1>

    <form class="cartao formulario" th:action="@{/web/categorias/{id}(id=${categoria.id()})}" method="post">
        <label>Nome<input name="nome" required th:value="${categoria.nome()}"></label>
        <label>Descrição<textarea name="descricao" rows="3" th:text="${categoria.descricao()}"></textarea></label>
        <div class="acoes">
            <button class="botao" type="submit">Salvar</button>
            <a class="botao botao-secundario" th:href="@{/web/categorias}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
