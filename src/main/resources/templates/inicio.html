<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Início')}"></head>
<body>
<header th:replace="~{fragments :: cabecalho}"></header>
<main class="conteudo">
    <div th:replace="~{fragments :: alertas}"></div>

    <div class="topo">
        <h1>Visão geral</h1>
        <a class="botao" th:href="@{/web/chamados/novo}">Abrir chamado</a>
    </div>

    <section class="grade-indicadores">
        <a class="indicador" th:href="@{/web/chamados}">
            <span class="indicador-valor" th:text="${totalChamados}">0</span>
            <span class="indicador-rotulo">Chamados</span>
        </a>
        <a class="indicador" th:href="@{/web/clientes}">
            <span class="indicador-valor" th:text="${totalClientes}">0</span>
            <span class="indicador-rotulo">Clientes</span>
        </a>
        <a class="indicador" th:href="@{/web/tecnicos}">
            <span class="indicador-valor" th:text="${totalTecnicos}">0</span>
            <span class="indicador-rotulo">Técnicos</span>
        </a>
        <a class="indicador" th:href="@{/web/categorias}">
            <span class="indicador-valor" th:text="${totalCategorias}">0</span>
            <span class="indicador-rotulo">Categorias</span>
        </a>
    </section>

    <section class="cartao">
        <h2>Chamados por status</h2>
        <div class="grade-status">
            <a th:each="item : ${porStatus}" class="status-item" th:href="@{/web/chamados(status=${item.key})}">
                <span th:replace="~{fragments :: status(${item.key})}"></span>
                <strong th:text="${item.value}">0</strong>
            </a>
        </div>
    </section>

    <section class="cartao">
        <h2>Chamados recentes</h2>
        <p class="vazio" th:if="${recentes.isEmpty()}">Nenhum chamado aberto ainda.</p>
        <table class="tabela" th:unless="${recentes.isEmpty()}">
            <thead>
            <tr><th>#</th><th>Título</th><th>Cliente</th><th>Prioridade</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${recentes}">
                <td th:text="${c.id()}"></td>
                <td><a th:href="@{/web/chamados/{id}(id=${c.id()})}" th:text="${c.titulo()}"></a></td>
                <td th:text="${nomesClientes[c.clienteId()]}"></td>
                <td><span th:replace="~{fragments :: prioridade(${c.prioridade()})}"></span></td>
                <td><span th:replace="~{fragments :: status(${c.status()})}"></span></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
