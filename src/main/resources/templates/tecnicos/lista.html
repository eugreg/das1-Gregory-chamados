<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Técnicos')}"></head>
<body>
<header th:replace="~{fragments :: cabecalho}"></header>
<main class="conteudo">
    <div th:replace="~{fragments :: alertas}"></div>

    <h1>Técnicos</h1>

    <section class="cartao">
        <h2>Novo técnico</h2>
        <form class="formulario em-linha" th:action="@{/web/tecnicos}" method="post">
            <label>Nome<input name="nome" maxlength="100" required></label>
            <label>E-mail<input name="email" type="email" required></label>
            <label>Perfil
                <select name="perfil" required>
                    <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
                </select>
            </label>
            <button class="botao" type="submit">Cadastrar</button>
        </form>
    </section>

    <section class="cartao">
        <p class="vazio" th:if="${tecnicos.isEmpty()}">Nenhum técnico cadastrado.</p>
        <table class="tabela" th:unless="${tecnicos.isEmpty()}">
            <thead>
            <tr><th>#</th><th>Nome</th><th>E-mail</th><th>Perfil</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tecnicos}">
                <td th:text="${t.id()}"></td>
                <td th:text="${t.nome()}"></td>
                <td th:text="${t.email()}"></td>
                <td th:text="${t.perfil()}"></td>
                <td class="acoes">
                    <a class="botao botao-secundario" th:href="@{/web/chamados(tecnicoId=${t.id()})}">Chamados</a>
                    <a class="botao botao-secundario" th:href="@{/web/tecnicos/{id}(id=${t.id()})}">Editar</a>
                    <form th:action="@{/web/tecnicos/{id}/excluir(id=${t.id()})}" method="post"
                          onsubmit="return confirm('Excluir este técnico?')">
                        <button class="botao botao-perigo" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
