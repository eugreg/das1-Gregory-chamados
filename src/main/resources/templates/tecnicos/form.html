<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Editar técnico')}"></head>
<body>
<header th:replace="~{fragments :: cabecalho}"></header>
<main class="conteudo estreito">
    <div th:replace="~{fragments :: alertas}"></div>

    <a class="voltar" th:href="@{/web/tecnicos}">← Técnicos</a>
    <h1>Editar técnico</h1>

    <form class="cartao formulario" th:action="@{/web/tecnicos/{id}(id=${tecnico.id()})}" method="post">
        <label>Nome<input name="nome" maxlength="100" required th:value="${tecnico.nome()}"></label>
        <label>E-mail<input name="email" type="email" required th:value="${tecnico.email()}"></label>
        <label>Perfil
            <select name="perfil" required>
                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"
                        th:selected="${p == tecnico.perfil()}"></option>
            </select>
        </label>
        <div class="acoes">
            <button class="botao" type="submit">Salvar</button>
            <a class="botao botao-secundario" th:href="@{/web/tecnicos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
